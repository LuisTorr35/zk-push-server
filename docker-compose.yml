services:
  app:
    build:
      context: .
      target: build
    command: npm run start:dev
    environment: &app-environment
      NODE_ENV: development
      PORT: 3000
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_POLL_INTERVAL_MS: ${WEBHOOK_POLL_INTERVAL_MS:-1000}
      WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-10000}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-10}
      COMMAND_ACK_TIMEOUT_SECONDS: ${COMMAND_ACK_TIMEOUT_SECONDS:-60}
      DATABASE_URL: postgresql://zk:zk@postgres:5432/zk_push?schema=public
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      PHOTO_STORAGE: ${PHOTO_STORAGE:-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-zk-photos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./test:/app/test
      - ./tools:/app/tools
      # Migrations are created inside the container but must land in the repo
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy

  webhook-worker:
    build:
      context: .
      target: build
    command: npm run worker:dev
    environment: *app-environment
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 40s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zk
      POSTGRES_PASSWORD: zk
      POSTGRES_DB: zk_push
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zk -d zk_push"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3 so PHOTO_STORAGE=1 can be tried without a cloud account.
  # Web console: http://localhost:9001 (minioadmin / minioadmin)
  minio:
    build: ./docker/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-init:
    build:
      context: .
      target: build
    environment:
      <<: *app-environment
      PHOTO_STORAGE: "1"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: zk-photos
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
    command: node dist/shared/storage/init-local-bucket.js

volumes:
  pgdata:
  miniodata:
